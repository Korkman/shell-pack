# shell-pack tmux.conf

# unconditional settings/bindings, moved here from .tmux.conf.sh: these are
# static values that don't depend on tmux version or shell computation

# basics
bind r source-file ~/.tmux.conf \; display "Config reloaded…"
# bind both ctrl-a and ctrl-b for muscle memory
set -qg prefix C-a
set -qg prefix2 C-b
# bind C-a a and C-b b to pass literal ctrl-a and ctrl-b
bind a send-prefix
bind b send-prefix -2

# start windows at 1 instead of 0 (0 being far away from ctrl-a on keyboard)
set -qg base-index 1
set -w -qg pane-base-index 1

# pass thru window title set by shell
set -qg set-titles on
set -qg set-titles-string '#T'

# allow shell to rename window
set -qg allow-rename on

# status line on
set -qg status on

# large history
set -qg history-limit 50000

# do pass clipboard OSC-52 codes so the client clipboard is updated
set -qg set-clipboard on

# display messages longer
set -qg display-time 4000

# copy and paste
# only in emacs mode the selection ends before the cursor, the more commonly encountered method
# the most important vi keys are merged into the emacs copy mode, mostly conflict-free
set -qg mode-keys emacs
# we need no command_prompt, it's perfectly fine to exit prompts with escape
set -qg status-keys emacs

# set very low escape time (ms), feels responsive, should not cause problems in our networks
set -qg escape-time 50

# automatic rename of window name to active pane title
set -w -qg automatic-rename on
set -w -qg automatic-rename-format '#T'

set -qg status-left-length 120
set -qg status-right-length 120

# intuitive window splitting
bind '|' split-window -h -c "#{pane_current_path}" # left/right, default: %
bind '-' split-window -v -c "#{pane_current_path}" # top/bottom, default: "

# add current path to new windows
bind c new-window -c "#{pane_current_path}"

# add C-a v for paste (unmodified)
bind v paste-buffer -r

# gnu screen compatibility
bind bspace previous-window # prev window, tmux default: p
bind space next-window      # next window, tmux default: n
bind C-space next-window    # catch accidential ctrl-key press
bind S split-window -v      # split vertical, tmux default: "
bind C-a last-window        # last window toggle, tmux default: l
bind Q break-pane           # make split region a dedicated window, tmux default: !
# kill current pane, tmux default: x
bind k confirm-before -p "Kill pane? (y/N)" kill-pane
# tab to move to next pane, tmux default: o
bind tab select-pane -t:.+
# kill all windows, screen-like + Shift-K
bind K confirm-before -p "Kill all windows and exit? (y/N)" kill-session
bind "\\" confirm-before -p "Kill all windows and exit? (y/N)" kill-session
# rename window, tmux default: ,
# added: disable renaming to make new name permanent
bind A command-prompt -I "#W" "rename-window '%%'; set -qw allow-rename off"
bind , command-prompt -I "#W" "rename-window '%%'; set -qw allow-rename off"

# top/bottom statusbar w/o mouse
bind M-t set -qg status-position top \; set -qg status-justify left
bind M-b set -qg status-position bottom \; set -qg status-justify centre

# show cheat --tmux
bind f1 run-shell 'fish --interactive -c "cheat --tmux"'
bind h run-shell 'fish --interactive -c "cheat --tmux"'

# restored defaults (2026-05-16)
bind-key z resize-pane -Z
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane
# end restored defaults

# new: shell config script
# for a custom color scheme, create $HOME/.config/tmux.conf.local.sh
# with one or more functions
#   custom_colors()
#   custom_styles()
#   custom_main()
# to overwrite values, see .tmux.conf.sh for details

# a note on the TERM variable:
# the initial tmux run has TERM unset for run-shell because the tmux server can technically start
# with no terminal attached. $TERM is basically always wrong here, so no more attempts are made to pass it.
# instead, the script will pull it from show-environment.
run-shell "\
	export TMUX_CONF_SH_IS_RELOAD=$(tmux show -gqv '@is-reload' 2>/dev/null); \
	[ ! -x '/usr/local/share/shell-pack/config/.tmux.conf.sh' ] \
	|| [ \"\$('/usr/local/share/shell-pack/config/.tmux.conf.sh' 2>&1 )\" = '' ] \
	|| TMUX_FAILSAFE=1 '/usr/local/share/shell-pack/config/.tmux.conf.sh' \
	; \
	[ ! -x '$HOME/.local/share/shell-pack/config/.tmux.conf.sh' ] \
	|| [ \"\$('$HOME/.local/share/shell-pack/config/.tmux.conf.sh' 2>&1 )\" = '' ] \
	|| TMUX_FAILSAFE=1 '$HOME/.local/share/shell-pack/config/.tmux.conf.sh' \
	; \
"
